services:
  postgres:
    image: postgres:16-alpine
    container_name: xdoingbot-postgres
    environment:
      POSTGRES_DB: xdoingbot
      POSTGRES_USER: xdoingbot
      POSTGRES_PASSWORD: xdoingbot
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xdoingbot -d xdoingbot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: xdoingbot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: xdoingbot-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://xdoingbot:xdoingbot@postgres:5432/xdoingbot?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  redis-data:
