services:
  postgres:
    image: postgres:16-alpine
    container_name: darvisxbot-postgres
    environment:
      POSTGRES_DB: darvisxbot
      POSTGRES_USER: darvisxbot
      POSTGRES_PASSWORD: darvisxbot
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darvisxbot -d darvisxbot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: darvisxbot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: darvisxbot-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://darvisxbot:darvisxbot@postgres:5432/darvisxbot?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  redis-data:
